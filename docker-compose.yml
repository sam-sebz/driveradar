name: driveradar

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driveradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driveradar}
      POSTGRES_DB: ${POSTGRES_DB:-driveradar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port by default, so a local PostgreSQL on 5432 does not clash.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-driveradar}:${POSTGRES_PASSWORD:-driveradar}@db:5432/${POSTGRES_DB:-driveradar}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
