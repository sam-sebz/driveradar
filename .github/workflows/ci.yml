name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Type-check (mypy)
        run: mypy app tests
      - name: Test against PostgreSQL (with Alembic migrations) + coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=70
          coverage report --include="app/domain/*" --fail-under=70
      - name: Migration matches models
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: |
          psql postgresql://test:test@localhost:5432/test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head && alembic check
      - name: Extraction eval (mock provider)
        run: python ../eval/run_eval.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Fresh-clone start, exactly as in the README
        run: |
          cp .env.example .env
          docker compose up --build -d --wait
      - name: Smoke test against the running stack
        run: python3 scripts/smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
